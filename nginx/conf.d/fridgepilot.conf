# HTTP → HTTPS
server {
    listen 80;
    server_name frid.weiverse.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name frid.weiverse.xyz;

    ssl_certificate     /etc/nginx/ssl/frid.weiverse.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/frid.weiverse.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location /api/v1/chat/stream {
        proxy_pass http://fridgepilotserver:8000/api/v1/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://fridgepilotserver:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
